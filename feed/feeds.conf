# 构建自定义包所需的外部 feed，pin 到具体 commit 以获得可复现构建。
#
# 背景：sing-box 的 Makefile 依赖 feeds/packages/lang/golang/golang-package.mk，
# 而 SDK/源码树自带的 feeds.conf.default 只 pin 到分支（openwrt-25.12），
# 意味着同一个 commit 在不同天构建时 golang 版本会随上游该分支推进而漂移，
# 构建不可复现。下面这些行会在 `scripts/feeds update -a` 之前，按 feed 名
# 整行覆盖 SDK 自带 feeds.conf.default 里的同名条目；未列出的 feed（如
# routing/telephony）保持 SDK 原样不动。
#
# 更新方法：
#   git ls-remote https://git.openwrt.org/feed/packages.git openwrt-25.12
#   git ls-remote https://git.openwrt.org/project/luci.git openwrt-25.12
# 把新 commit 填进来，并在提交信息里说明为什么升级（需要某个新包还是修复）。

src-git packages https://git.openwrt.org/feed/packages.git^3dc6fa0d383ff58c1c84296c2e7c3d7431709c42
src-git luci https://git.openwrt.org/project/luci.git^37279809c2ecdb61ff5110fbc0a12159e8510eef
