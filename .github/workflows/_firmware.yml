# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# 可复用 workflow：组装并发布单个 variant 的固件（official 线）。步骤即编排——
# 每一步要么调一个 wrt 动词、要么下 IB / make image，逻辑不落在这里。
# 与 scripts/local-ib.sh（本地测试工具）各走各的：这里在 GH runner 上直接
# make image（runner 本身就是 ubuntu，装上依赖即可，不必再套 Docker）。
#
# 发布前一道 manifest 回归门禁：IB 产出的官方 .manifest 原名收进 release 目录，
# 其文件名记进旁挂 meta.json；下次构建据上一版 meta.json 的 manifest_file 拉上一版
# 比对，有包消失即 fail——直击「IB 条件依赖静默失效、某包悄悄少装」那类不会报错的
# 坑。比对逻辑在 wrt verify manifest 里。

name: (internal) Assemble firmware

on:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
      release_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    env:
      WRT_S3_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      WRT_S3_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      REPO_BASE: ${{ vars.R2_PUBLIC_URL }}
      VARIANT: ${{ inputs.variant }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wrt
      - run: |
          chmod +x wrt
          echo "WRT=$PWD/wrt" >> "$GITHUB_ENV"

      - name: 读取 variant 事实
        run: |
          R="$($WRT resolve "$VARIANT")"
          echo "$R" | jq .
          {
            echo "ARTIFACTS=$(echo "$R" | jq -r .line.artifacts)"
            echo "TARGET=$(echo "$R" | jq -r .hardware.target)"
            echo "SUBTARGET=$(echo "$R" | jq -r .hardware.subtarget)"
            echo "PROFILE=$(echo "$R" | jq -r .hardware.profile)"
            echo "OPENWRT_VERSION=$(echo "$R" | jq -r .line.openwrt_version)"
            echo "DEVICE=$(echo "$R" | jq -r .device)"
            echo "LINE=$(echo "$R" | jq -r .line.id)"
            echo "PARTSIZE=$(echo "$R" | jq -r '.image.rootfs_partsize // 0')"
            echo "PACKAGES=$(echo "$R" | jq -r '.packages | join(" ")')"
          } >> "$GITHUB_ENV"

      - name: 磁盘预检
        run: |
          avail=$(df -Pk . | awk 'NR==2{print int($4/1048576)}')
          [ "$avail" -ge 10 ] || { echo "::error::可用磁盘 ${avail}GiB < 10GiB"; exit 1; }

      - name: 安装 ImageBuilder 依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 python3-setuptools rsync unzip wget zstd file xz-utils gawk

      - name: 取得 ImageBuilder（official 下官方 / self 从 R2 拉自建）
        run: |
          mkdir -p ib
          if [ "$ARTIFACTS" = official ]; then
            IB_BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}"
            curl -fsSL --retry 3 -o sha256sums "$IB_BASE/sha256sums"
            IB_FILE="$(grep -oE 'openwrt-imagebuilder-[^[:space:]]+\.tar\.(zst|xz|gz)' sha256sums | head -1)"
            [ -n "$IB_FILE" ] || { echo "::error::sha256sums 里没有 imagebuilder 归档"; exit 1; }
            curl -fL --retry 3 -o "$IB_FILE" "$IB_BASE/$IB_FILE"
            EXPECT="$(grep -E "[[:space:]][*]?${IB_FILE}\$" sha256sums | awk '{print $1}' | head -1)"
            echo "${EXPECT}  ${IB_FILE}" | sha256sum -c -
            tar -xf "$IB_FILE" --strip-components=1 -C ib
            # official：vermagic 抠自官方 IB 自带 repositories。
            REPOF=""; for c in ib/repositories ib/repositories.conf; do [ -f "$c" ] && { REPOF="$c"; break; }; done
            VM="$(grep -oE '/kmods/[^/]+/' "$REPOF" | head -1 | sed 's|/kmods/||;s|/||')"
          else
            # self：current.json 指针 → builds/<build_id>/sdk-ib/<imagebuilder_archive>，
            # vermagic 直接取自 current.json（唯一权威来源，别处不再 curl）。
            META="$REPO_BASE/$LINE/targets/${TARGET}/${SUBTARGET}/current.json"
            CUR="$(curl -fsSL --connect-timeout 15 "$META" 2>/dev/null || true)"
            BUILD_ID="$(echo "$CUR" | jq -r '.build_id // empty')"
            IB_FILE="$(echo "$CUR" | jq -r '.imagebuilder_archive // empty')"
            VM="$(echo "$CUR" | jq -r '.vermagic // empty')"
            [ -n "$BUILD_ID" ] && [ -n "$IB_FILE" ] && [ -n "$VM" ] || {
              echo "::error::R2 没有 $META 或缺 build_id/imagebuilder_archive/vermagic；先为 $LINE 跑 toolchain"; exit 1; }
            IB_BASE="$REPO_BASE/$LINE/targets/${TARGET}/${SUBTARGET}/builds/$BUILD_ID/sdk-ib"
            curl -fsSL --retry 3 -o sha256sums "$IB_BASE/sha256sums"
            curl -fL --retry 3 -o "$IB_FILE" "$IB_BASE/$IB_FILE"
            EXPECT="$(grep -E "[[:space:]][*]?${IB_FILE}\$" sha256sums | awk '{print $1}' | head -1)"
            echo "${EXPECT}  ${IB_FILE}" | sha256sum -c -
            tar -xf "$IB_FILE" --strip-components=1 -C ib
          fi
          [ -n "$VM" ] || { echo "::error::无法确定 vermagic"; exit 1; }
          # 注意变量名不能叫 IB：OpenWrt 顶层 IB Makefile 用 $(IB) 作「是否
          # ImageBuilder」标志（顶层默认不设、只在子 make 传 IB=1）。若经 GITHUB_ENV
          # 导出名为 IB 的环境变量，make 会把它当 $(IB)=非空，触发 rootfs.mk 里
          # $(if $(IB),,awk...) 展开为空 + 游离的 `;` → prepare_rootfs 渲染出
          # `then ; sed...` → bash 语法错。故用 IB_ROOT（OpenWrt 全库未用此名）。
          echo "IB_ROOT=$PWD/ib" >> "$GITHUB_ENV"
          echo "VERMAGIC=$VM" >> "$GITHUB_ENV"

      - name: 装配三层软件源与 rootfs overlay
        run: |
          REPOS="$($WRT repos "$VARIANT" --vermagic "$VERMAGIC" --repo-base "$REPO_BASE")"
          echo "$REPOS" | jq -r '.build[]' > "$IB_ROOT/repositories.conf"
          cp "$IB_ROOT/repositories.conf" "$IB_ROOT/repositories"
          "$WRT" files "$VARIANT" "$IB_ROOT/files-overlay"
          mkdir -p "$IB_ROOT/files-overlay/etc/apk/repositories.d"
          echo "$REPOS" | jq -r '.runtime[]' > "$IB_ROOT/files-overlay/etc/apk/repositories.d/99-custom.list"

      - name: 注入自有公钥（IB 装包信任 + 设备运行期信任）
        env:
          APK_PUBLIC_KEY: ${{ secrets.APK_PUBLIC_KEY }}
        # 自有 L1（及 self 线的 L2）是用我们的密钥签的，官方 IB 的 apk 默认只信
        # 官方密钥，不注入公钥则 make image 装自有包时报 UNTRUSTED。两处都要放：
        #   ib/keys/<fp>.pem                       —— make image 期间 IB 的 apk 信任
        #   overlay/etc/apk/keys/<fp>.pem          —— 烧进固件，设备日后 apk update 信任
        # apk 按公钥内容验签、不认文件名，<fp> 只是命名惯例（sha256 前 32 位）。
        run: |
          [ -n "$APK_PUBLIC_KEY" ] || { echo "::error::缺 secrets.APK_PUBLIC_KEY，装不上自有包"; exit 1; }
          printf '%s\n' "$APK_PUBLIC_KEY" > pub.pem
          FP="$(openssl dgst -sha256 -binary < pub.pem | xxd -p -c 256 | head -c 32)"
          mkdir -p "$IB_ROOT/keys" "$IB_ROOT/files-overlay/etc/apk/keys"
          cp pub.pem "$IB_ROOT/keys/${FP}.pem"
          cp pub.pem "$IB_ROOT/files-overlay/etc/apk/keys/${FP}.pem"
          rm -f pub.pem
          echo "已注入公钥 ${FP}.pem"

      - name: make image
        working-directory: ib
        run: |
          # BIN_DIR 必须给绝对路径：armsr 等目标的 kernel_prepare 在构建子目录里跑，
          # 相对 BIN_DIR=out 会解析成子目录下不存在的 out/，导致 cpio 重定向失败
          # （"out/...rootfs.cpio.gz: No such file or directory" → broken pipe）。
          ARGS=(PROFILE="$PROFILE" PACKAGES="$PACKAGES" FILES=files-overlay BIN_DIR="$IB_ROOT/out")
          [ "$PARTSIZE" -gt 0 ] && ARGS+=(ROOTFS_PARTSIZE="$PARTSIZE")
          make image "${ARGS[@]}"

      - name: 产物形状断言
        run: |
          # 不同目标产物名不同：VM/generic 出 *.img.gz，真实设备出 *-sysupgrade.bin /
          # *-factory.bin / *.itb 等。断言「至少产出一个固件镜像」——即 out/ 里除
          # 元数据（sha256sums / *.manifest / *.buildinfo / *.json）外还有文件。
          imgs="$(find "$IB_ROOT/out" -maxdepth 1 -type f \
            ! -name sha256sums ! -name '*.manifest' ! -name '*.buildinfo' ! -name '*.json')"
          [ -n "$imgs" ] || { echo "::error::make image 没产出任何固件镜像"; exit 1; }
          echo "产出镜像："; echo "$imgs"

      - name: manifest 回归门禁（与上一版比，有包消失即 fail）
        run: |
          # curr = IB 产出的官方包清单（原名，不改名不复制）。
          CURR="$(ls "$IB_ROOT"/out/*.manifest 2>/dev/null | head -1 || true)"
          [ -n "$CURR" ] || { echo "::error::make image 没产出 .manifest"; exit 1; }
          # 记住本版清单文件名，下一步写进 meta.json 供下一版定位（清单原名带版本、不可预测）。
          echo "MANIFEST_FILE=$(basename "$CURR")" >> "$GITHUB_ENV"
          # 上一版 = 当前 current.json 指向的 release；其官方清单文件名记在该 release 的 meta.json 里。
          LINEDIR="devices/${DEVICE}/${LINE}"
          PREV_RID="$(curl -fsSL --connect-timeout 15 "$REPO_BASE/$LINEDIR/current.json" 2>/dev/null | jq -r '.release_id // empty' || true)"
          PREV_ARG=""
          if [ -n "$PREV_RID" ]; then
            PREV_MF="$(curl -fsSL --connect-timeout 15 "$REPO_BASE/$LINEDIR/releases/$PREV_RID/meta.json" 2>/dev/null | jq -r '.manifest_file // empty' || true)"
            if [ -n "$PREV_MF" ] && curl -fsSL --connect-timeout 15 -o prev.manifest \
                 "$REPO_BASE/$LINEDIR/releases/$PREV_RID/$PREV_MF" 2>/dev/null; then
              PREV_ARG="--prev prev.manifest"
            else
              echo "::warning::上一版 $PREV_RID 取不到官方清单（可能早于本模型），跳过比对"
            fi
          fi
          "$WRT" verify manifest $PREV_ARG --curr "$CURR"

      - name: 组装发布目录（IB out/ 原样 + meta/current 旁挂）
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          LINEDIR="devices/${DEVICE}/${LINE}"
          RELDIR="${LINEDIR}/releases/${RELEASE_ID}"
          mkdir -p "stage/${RELDIR}"
          # 严格官方：IB 的 out/ 整份原样收进 release 目录——镜像 + sha256sums +
          # 原名 *.manifest + profiles.json + *.buildinfo + SBOM，不改名、不丢文件。
          cp -a "$IB_ROOT/out/." "stage/${RELDIR}/"
          # 旁挂控制面（官方没有、我们流程所需）：
          #   meta.json    不可变档案：GC 引用计数(build_id/vermagic) + 门禁锚点(manifest_file) + variant 指纹
          #   current.json 可变指针：variant 指纹(plan 一跳) + 指向的 release_id
          "$WRT" meta manifest "$VARIANT" --release-id "$RELEASE_ID" --vermagic "$VERMAGIC" \
            --manifest-file "$MANIFEST_FILE" --ci-run-url "$RUN_URL" > "stage/${RELDIR}/meta.json"
          "$WRT" meta latest "$VARIANT" --release-id "$RELEASE_ID" > "stage/${LINEDIR}/current.json"
          find stage -type f | sed 's|^stage/||'

      - name: 发布到 R2（内容→索引→指针）
        run: |
          "$WRT" publish stage ""
